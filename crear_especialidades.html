<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="crear_especialidades_styles.css">
    <link rel="stylesheet" href="dashboard_style.css">
    <script src="dashboard.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2 id="admin-portal-text">Admin Portal</h2>
                <p id="start-nav-message">Gestión hospitalaria</p>
            </div>
            <ul>
                <li><a href="dashboard_panel.html">
                        <div class="nav-panel">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-layout-panel-left preview-icon">
                                <rect width="7" height="18" x="3" y="3" rx="1" />
                                <rect width="7" height="7" x="14" y="3" rx="1" />
                                <rect width="7" height="7" x="14" y="14" rx="1" />
                            </svg>
                            Panel
                        </div>
                    </a>
                </li>
                <li><a href="dashboard_doctores.html">
                        <div class="nav-doctores">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-briefcase-medical preview-icon">
                                <path d="M12 11v4" />
                                <path d="M14 13h-4" />
                                <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
                                <path d="M18 6v14" />
                                <path d="M6 6v14" />
                                <rect width="20" height="14" x="2" y="6" rx="2" />
                            </svg>
                            Doctores
                        </div>
                    </a>
                </li>
                <li><a href="dashboard_especialidades.html">
                        <div class="nav-especialidades">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-bandage preview-icon">
                                <path d="M10 10.01h.01" />
                                <path d="M10 14.01h.01" />
                                <path d="M14 10.01h.01" />
                                <path d="M14 14.01h.01" />
                                <path d="M18 6v12" />
                                <path d="M6 6v12" />
                                <rect x="2" y="6" width="20" height="12" rx="2" />
                            </svg>
                            Especialidades
                        </div>
                    </a>
                </li>
                <li><a href="#">
                        <div class="nav-busqueda">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-user-round-search preview-icon">
                                <circle cx="10" cy="8" r="5" />
                                <path d="M2 21a8 8 0 0 1 10.434-7.62" />
                                <circle cx="18" cy="18" r="3" />
                                <path d="m22 22-1.9-1.9" />
                            </svg>
                            Búsqueda de pacientes
                        </div>
                    </a>
                </li>
            </ul>
            <button id="settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-settings preview-icon">
                    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 
            2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 
            1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                Configuración
            </button>
            <button id="logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-log-out preview-icon">
                    <path d="m16 17 5-5-5-5" />
                    <path d="M21 12H9" />
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                </svg>
                Cerrar Sesión
            </button>
        </nav>

        <main>
            <div class="indicador-pagina">
                <p class="esp">Especialidades</p>
                <p class="flecha">></p>
                <p class="agr">Agregar Nueva Especialidad</p>
            </div>

            <div class="titulos-header">
                <h2>Registrar Nueva Especialidad</h2>
                <p>Complete la información técnica y administrativa para dar de alta una especialidad médica en el
                    sistema hospitalario.</p>
            </div>

            <div class="create-card">
                <form class="create-form">
                    <div class="name">
                        <label for="name">Nombre de la Especialidad</label>
                        <input type="text" id="name" name="name" placeholder="Ej. Cardiología intervencionista"
                            required>
                    </div>

                    <div class="description">
                        <label for="description">Descripción</label>
                        <input type="text" id="description" name="description"
                            placeholder="Detalle el alcance de la especialidad, procedimientos principales y requisitos de derivación..."
                            required>
                    </div>

                    <div class="options">
                        <label for="options">Elige una opción:</label>
                        <select id="options" name="options">
                            <option value="active">Activado - Disponible para Programación</option>
                            <option value="inactive">Desactivado - No disponible para Programación</option>
                        </select>
                    </div>

                    <div class="buttons">
                        <button type="cancel" class="btn-cancel">
                            Cancelar
                        </button>

                        <button type="save" class="btn-save">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-save preview-icon">
                                <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
                                <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" />
                                <path d="M7 3v4a1 1 0 0 0 1 1h7" />
                            </svg>
                            Guardar Especialidad
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
