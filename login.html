<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

  <script src="login.js"></script>
</head>
<body>
  <div class="login-container">
    <form>
      <label id="welcome-message">Bienvenido de nuevo<br></label>
      <label>Por favor, autentiquese para acceder al portal de proveedores</label>

      <label for="username">Nombre de usuario:</label>
      <input type="text" id="username" name="username" placeholder="&#9777;  Ingrese ID de admin" required>
      <br>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>
      <br>
      <button type="submit">Iniciar Sesión</button>
      <div id="below-message">
        <p><strong> Solo acceso seguro:</strong> lorem ipsum etc etc</p>
      </div>
    </form>
  </div>
</body>
</html>
